<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Code - Multi-Course Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Learning Code</h2>
            </div>
            
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Courses populated by JavaScript -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <p class="username" id="current-username">Guest</p>
                        <p class="user-level">Select Course</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
                       <div class="topbar">
                <div class="topbar-controls">
                    <button class="btn-exit" id="exit-course-btn" style="display: none;">
                        ← Exit Course
                    </button>
                </div>
                

                <div class="topbar-stats">
                    <div class="stat">
                        <label>Progress</label>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <span id="progress-text">0/10</span>
                    </div>
                    <div class="stat">
                        <label>Score</label>
                        <span class="score-value" id="total-score">0</span>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="content-area" id="content-area">
                <!-- JavaScript populates this -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
