<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMaster - Professional Coding Courses</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper" id="app-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <h2>CodeMaster</h2>
                <p class="tagline">Master Programming</p>
            </div>
            
            <nav class="sidebar-nav" id="sidebar-nav">
                <div class="nav-item active" data-section="course">
                    <span class="icon">📚</span>
                    <span>Course</span>
                </div>
                <div class="nav-item" data-section="qa">
                    <span class="icon">❓</span>
                    <span>Q&A</span>
                </div>
                <div class="nav-item" data-section="tasks">
                    <span class="icon">✅</span>
                    <span>Tasks</span>
                </div>
                <div class="nav-item" data-section="resources">
                    <span class="icon">📖</span>
                    <span>Resources</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <p class="username" id="current-username">Guest</p>
                        <p class="user-level">Beginner</p>
                    </div>
                </div>
                <button class="btn-edit-name" id="btn-edit-name" onclick="showEditNameModal()">✏️ Edit Name</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            <div class="topbar">
                <div class="breadcrumb">
                    <span id="breadcrumb-course">Course</span>
                    <span class="separator">/</span>
                    <span id="lesson-title">Welcome</span>
                </div>
                
                <div class="topbar-stats">
                    <div class="stat">
                        <label>Progress</label>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <span id="progress-text">0/10</span>
                    </div>
                    <div class="stat">
                        <label>Score</label>
                        <span class="score-value" id="total-score">0</span>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="content-area" id="content-area">
                <!-- JavaScript populates this -->
            </div>
        </main>
    </div>

    <!-- EDIT NAME MODAL -->
    <div class="modal" id="edit-name-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Your Name</h3>
                <button class="modal-close" onclick="closeEditNameModal()">✕</button>
            </div>
            <div class="modal-body">
                <input 
                    type="text" 
                    id="edit-name-input" 
                    placeholder="Enter new name"
                    maxlength="30"
                />
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeEditNameModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmEditName()">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
