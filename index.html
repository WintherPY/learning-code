<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Code Learning Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to the Interactive Code Learning Platform</h1>
    </header>
    <main>
        <section id="qa-interface">
            <h2>Q&A Interface</h2>
            <textarea id="question" placeholder="Ask your question..."></textarea>
            <button id="ask-button">Ask</button>
            <div id="answers"></div>
        </section>
        <section id="code-snippets">
            <h2>Code Snippet Display</h2>
            <pre><code id="code-display">// Your code snippets will appear here.</code></pre>
        </section>
        <section id="virtual-code-editor">
            <h2>Virtual Code Editor for Tasks</h2>
            <textarea id="code-editor" placeholder="Write your code here..."></textarea>
            <button id="run-code">Run Code</button>
            <div id="output"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Interactive Code Learning Platform</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
