<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Code - Language Identifier</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Learning Code</h1>
            <p>Identify programming languages from code snippets</p>
        </header>

        <main>
            <div class="question-counter">
                <span>Question <span id="current-question">1</span> of 5</span>
            </div>

            <section class="code-section">
                <h2>Code Snippet:</h2>
                <pre><code id="code-display">// Loading...</code></pre>
            </section>

            <section class="question-section">
                <h3 id="question-text">What language is this code written in?</h3>
                
                <div class="options-container" id="options-container">
                    <!-- Options will be generated here -->
                </div>
            </section>

            <div class="feedback" id="feedback-section" style="display: none;">
                <p id="feedback-text"></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Learning Code Platform</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
