<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Code - Multi-Course Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo" onclick="confirmExitCourse()" title="Click to return to main menu">
                <h2>📚 Learning Code</h2>
            </div>
            
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Courses populated by JavaScript -->
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar" id="user-avatar">U</div>
                    <div class="user-details">
                        <p class="username" id="current-username">Guest</p>
                        <p class="user-level">Select Course</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            <div class="topbar">
                <div class="breadcrumb">
                    <span id="breadcrumb-course">Courses</span>
                    <span class="separator">/</span>
                    <span id="lesson-title">Welcome</span>
                </div>
                
                <div class="topbar-stats">
                    <div class="stat">
                        <label>Progress</label>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <span id="progress-text">0/10</span>
                    </div>
                    <div class="stat">
                        <label>Score</label>
                        <span class="score-value" id="total-score">0</span>
                    </div>
                </div>
            </div>

            <!-- MAIN CONTENT AREA -->
            <div class="content-area" id="content-area">
                <!-- JavaScript populates this -->
            </div>
        </main>
    </div>

    <!-- EXIT COURSE MODAL -->
    <div class="modal" id="exit-course-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚠️ Exit Course?</h3>
            </div>
            <div class="modal-body">
                <p id="exit-message">You are exiting the course - Continue?</p>
                <p style="font-size: 0.9em; color: #999; margin-top: 10px;">Any progress will not be saved.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeExitCourseModal()">No, Stay</button>
                <button class="btn-danger" onclick="exitCourse()">Yes, Exit</button>
            </div>
        </div>
    </div>

    <!-- MAIN PAGE EXIT MODAL -->
    <div class="modal" id="main-page-exit-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🏠 Return to Main Menu?</h3>
            </div>
            <div class="modal-body">
                <p>You are returning to the main page - Continue?</p>
                <p style="font-size: 0.9em; color: #999; margin-top: 10px;">You will need to enter your name again.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeMainPageExitModal()">No</button>
                <button class="btn-danger" onclick="confirmMainPageExit()">Yes, Return</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
